<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليجن ستور - الفيروز</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    background: linear-gradient(135deg,#edf3f0,#f8f3ed,#e9eff1);
    color: #333;
    line-height: 1.7;
}

.container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    min-height: 100vh;
    box-shadow: 0 0 25px rgba(0,0,0,.07);
}

.header {
    background: linear-gradient(135deg,#243b36,#526d62,#899b8c);
    color: white;
    text-align: center;
    padding: 22px;
    font-size: 23px;
    font-weight: bold;
}

.banner-container {
    width: 100%;
    background: #eee;
}

.banner-img {
    width: 100%;
    display: block;
}

.specs-box {
    background: #f7faf5;
    border: 1px solid #cbd9cb;
    padding: 15px;
    margin: 15px;
    border-radius: 12px;
    color: #405747;
    font-size: 13px;
}

.specs-box h4 {
    margin-bottom: 8px;
    color: #526d62;
}

.specs-box ul {
    list-style: none;
}

.specs-box li {
    margin-bottom: 5px;
}

.content-body {
    padding: 15px;
}

.product-card {
    background: #fff;
    border: 1px solid #dce6df;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.04);
}

.product-title {
    font-size: 17px;
    font-weight: bold;
    color: #385447;
    margin-bottom: 12px;
    border-right: 4px solid #b78c72;
    padding-right: 10px;
}

.info-box {
    background: #f4f7f5;
    padding: 9px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 10px;
}

.offer-price-box {
    background: #fff7f0;
    border: 1px dashed #d5a88e;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    color: #85583f;
    margin-bottom: 12px;
}

.available-colors-preview {
    background: #fafafa;
    border: 1px solid #eee;
    padding: 9px;
    border-radius: 8px;
    margin-bottom: 12px;
}

.available-colors-title {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 7px;
}

.preview-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.chip {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 5px;
    font-weight: bold;
    border: 1px solid #ddd;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
    color: #405447;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd8cf;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

input:focus, select:focus {
    outline: none;
    border-color: #718d79;
}

.sub-item-box {
    background: #f7f9f7;
    border: 1px solid #dce5dd;
    padding: 12px;
    border-radius: 9px;
    margin-top: 10px;
}

.sub-item-title {
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 13px;
}

.buttons-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.color-btn {
    border: 2px solid #ddd;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.color-btn.active {
    border-color: #b77958 !important;
    background: #b77958 !important;
    color: white !important;
}

.c-black {background:#111;color:white}
.c-white {background:white;color:#333}
.c-offwhite {background:#fdfbf7;color:#444}
.c-blue {background:#2563eb;color:white}
.c-navy {background:#1e3a8a;color:white}
.c-brown {background:#78350f;color:white}
.c-beige {background:#f5f5dc;color:#444}
.c-cafe {background:#8b5a2b;color:white}
.c-gray {background:#6b7280;color:white}
.c-turquoise {background:#06b6d4;color:white}
.c-olive {background:#3f6212;color:white}
.c-red {background:#dc2626;color:white}
.c-fuchsia {background:#db2777;color:white}
.c-burgundy {background:#581c87;color:white}
.c-babypink {background:#fbcfe8;color:#831843}

.bill-box {
    background: #f9f6f1;
    border: 2px dashed #b9a18e;
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
}

.bill-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: bold;
}

.bill-total {
    border-top: 1px solid #ddd;
    padding-top: 10px;
    font-size: 18px;
    color: #526d62;
}

.btn-whatsapp {
    display: block;
    width: 100%;
    background: linear-gradient(135deg,#25d366,#128c7e);
    color: white;
    text-align: center;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #718078;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
👑 ليجن ستور - الفيروز 👑
</div>

<div class="banner-container">
<img src="https://raw.githubusercontent.com/12345000ahmed-create/fz-app/main/1794292613599.jpg"
class="banner-img" alt="ليجن ستور الفيروز">
</div>

<div class="specs-box">
<h4>⭐ مميزات الخدمة والضمان</h4>
<ul>
<li>✔ خامات قطن ليكرا عالية الجودة.</li>
<li>✔ معاينة قبل الاستلام.</li>
<li>✔ شحن لجميع محافظات الجمهورية.</li>
</ul>
</div>

<div class="content-body">

<form id="orderForm">

<div id="productsArea"></div>

<h3 style="margin:20px 0;color:#526d62">
بيانات استلام الطلب
</h3>

<div class="form-group">
<label>الاسم بالكامل</label>
<input type="text" id="custName" required placeholder="الاسم الثلاثي">
</div>

<div class="form-group">
<label>رقم الهاتف</label>
<input type="tel" id="custPhone" required placeholder="رقم الموبايل">
</div>

<div class="form-group">
<label>المحافظة</label>
<select id="custGov" required>
<option value="">اختار المحافظة</option>
<option value="القاهرة" data-ship="65">القاهرة</option>
<option value="الجيزة" data-ship="65">الجيزة</option>
<option value="الصف والعياط" data-ship="90">الصف والعياط</option>
<option value="الإسكندرية" data-ship="65">الإسكندرية</option>
<option value="القليوبية" data-ship="65">القليوبية</option>
<option value="الدقهلية" data-ship="65">الدقهلية</option>
<option value="الشرقية" data-ship="65">الشرقية</option>
<option value="الغربية" data-ship="65">الغربية</option>
<option value="المنوفية" data-ship="65">المنوفية</option>
<option value="البحيرة" data-ship="65">البحيرة</option>
<option value="كفر الشيخ" data-ship="65">كفر الشيخ</option>
<option value="دمياط" data-ship="65">دمياط</option>
<option value="بورسعيد" data-ship="65">بورسعيد</option>
<option value="الإسماعيلية" data-ship="65">الإسماعيلية</option>
<option value="السويس" data-ship="65">السويس</option>
<option value="الفيوم" data-ship="90">الفيوم</option>
<option value="بني سويف" data-ship="90">بني سويف</option>
<option value="المنيا" data-ship="90">المنيا</option>
<option value="أسيوط" data-ship="90">أسيوط</option>
<option value="سوهاج" data-ship="90">سوهاج</option>
<option value="قنا" data-ship="90">قنا</option>
<option value="أسوان" data-ship="90">أسوان</option>
<option value="الأقصر" data-ship="90">الأقصر</option>
<option value="البحر الأحمر" data-ship="120">البحر الأحمر</option>
<option value="مطروح" data-ship="120">مطروح</option>
<option value="الوادي الجديد" data-ship="120">الوادي الجديد</option>
<option value="شمال سيناء" data-ship="120">شمال سيناء</option>
<option value="جنوب سيناء" data-ship="120">جنوب سيناء</option>
</select>
</div>

<div class="form-group">
<label>تفاصيل العنوان</label>
<input type="text" id="custAddress" required placeholder="المدينة والشارع والعنوان بالتفصيل">
</div>

<div class="bill-box">

<div class="bill-row">
<span>عدد القطع:</span>
<span id="totalQty">0</span>
</div>

<div class="bill-row">
<span>سعر المنتجات:</span>
<span id="productsPriceText">0 جنيه</span>
</div>

<div class="bill-row">
<span>الشحن:</span>
<span id="shippingPriceText">0 جنيه</span>
</div>

<div class="bill-row bill-total">
<span>الإجمالي النهائي:</span>
<span id="finalTotalPriceText">0 جنيه</span>
</div>

</div>

<button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">
<i class="fab fa-whatsapp"></i>
تأكيد الطلب عبر الواتساب
</button>

</form>
</div>

<div class="footer">
ليجن ستور - الفيروز
</div>

</div>

<script>

const WHATSAPP_NUMBER = "201080239769";

const colorDatabase = {

hearts: [
["أسود","c-black"],
["بني","c-brown"],
["كحلي","c-navy"],
["رمادي","c-gray"],
["أزرق","c-blue"],
["بيج","c-beige"]
],

derby: [
["أسود","c-black"],
["أبيض","c-white"],
["أوف وايت","c-offwhite"],
["بني","c-brown"],
["بيج","c-beige"],
["كافيه","c-cafe"],
["نبيتي","c-burgundy"],
["أزرق","c-blue"],
["كحلي","c-navy"],
["بترولي","c-turquoise"],
["زيتي","c-olive"],
["بنفسجي","c-burgundy"],
["فوشيا","c-fuchsia"],
["بيبي بينك","c-babypink"]
],

shorts: [
["أسود","c-black"],
["أبيض","c-white"],
["أزرق","c-blue"],
["كحلي","c-navy"],
["بني","c-brown"],
["بيج","c-beige"],
["رمادي","c-gray"]
]

};

const products = {

hearts: {
name: "ليجن القلوب الفاخر",
colors: colorDatabase.hearts
},

derby: {
name: "ليجن الديربي المضلع",
colors: colorDatabase.derby
},

shorts: {
name: "شورت الديربي المضلع الطويل",
colors: colorDatabase.shorts
}

};

let selectionsMap = {
hearts: [],
derby: [],
shorts: []
};

function createProducts() {

let html = "";

for (const key in products) {

let p = products[key];

let offers = key === "hearts"
? "قطعة 120 | قطعتين 220 | 3 قطع 250 | 4 قطع 320 | 5 قطع 390 | 6 قطع أو أكثر 75 للقطعة"
: key === "derby"
? "قطعة 120 | قطعتين 200 | 3 قطع 250 | من 4 إلى 5: 75 للقطعة | من 6 إلى 11: 70 للقطعة | 12 فأكثر: 65 للقطعة"
: "قطعة 150 | قطعتين 160 | 3 قطع 210 | 4 قطع 260 | 5 قطع أو أكثر 60 للقطعة";

html += `
<div class="product-card">

<div class="product-title">
${p.name}
</div>

<div class="info-box">
المواصفات: وان سايز قطن ليكرا مناسب من 50 إلى 100 كجم
</div>

<div class="offer-price-box">
🏷 أسعار العرض:<br>
${offers}
</div>

<div class="available-colors-preview">
<div class="available-colors-title">🎨 الألوان المتاحة:</div>
<div class="preview-chips">
${p.colors.map(c=>`
<span class="chip ${c[1]}">${c[0]}</span>
`).join("")}
</div>
</div>

<div class="form-group">
<label>عدد القطع المطلوب:</label>
<input type="number" id="qty_${key}" min="0" max="20" value="0"
oninput="renderColors('${key}');calcBill()">
</div>

<div id="sub_items_${key}"></div>

</div>
`;

}

document.getElementById("productsArea").innerHTML = html;

}

function renderColors(key) {

let qty = Math.min(20,Math.max(0,parseInt(document.getElementById("qty_"+key).value)||0));

document.getElementById("qty_"+key).value = qty;

let box = document.getElementById("sub_items_"+key);

while(selectionsMap[key].length < qty) {
selectionsMap[key].push(products[key].colors[0][0]);
}

selectionsMap[key].length = qty;

let html = "";

for(let i=0;i<qty;i++) {

html += `
<div class="sub-item-box">

<div class="sub-item-title">
القطعة رقم (${i+1}) - اختاري اللون
</div>

<div class="buttons-grid">

${products[key].colors.map(c=>`

<button type="button"
class="color-btn ${c[1]} ${selectionsMap[key][i]===c[0]?'active':''}"
onclick="pickColor('${key}',${i},'${c[0]}',this)">
${c[0]}
</button>

`).join("")}

</div>
</div>
`;

}

box.innerHTML = html;

}

function pickColor(key,idx,name,btn) {

selectionsMap[key][idx] = name;

let parent = btn.closest(".sub-item-box");

parent.querySelectorAll(".color-btn").forEach(b=>{
b.classList.remove("active");
});

btn.classList.add("active");

}

function getPrice(key,qty) {

if(qty===0) return 0;

if(key==="hearts") {

if(qty===1) return 120;
if(qty===2) return 220;
if(qty===3) return 250;
if(qty===4) return 320;
if(qty===5) return 390;
return qty*75;

}

if(key==="derby") {

if(qty===1) return 120;
if(qty===2) return 200;
if(qty===3) return 250;
if(qty<=5) return qty*75;
if(qty<=11) return qty*70;
return qty*65;

}

if(key==="shorts") {

if(qty===1) return 150;
if(qty===2) return 160;
if(qty===3) return 210;
if(qty===4) return 260;
return qty*60;

}

return 0;

}

function calcBill() {

let total = 0;
let qtyTotal = 0;

for(const key in products) {

let qty = parseInt(document.getElementById("qty_"+key).value)||0;

total += getPrice(key,qty);

qtyTotal += qty;

}

let gov = document.getElementById("custGov");

let shipping = gov.selectedOptions[0]?.dataset.ship || 0;

shipping = Number(shipping);

document.getElementById("totalQty").innerText = qtyTotal;

document.getElementById("productsPriceText").innerText = total+" جنيه";

document.getElementById("shippingPriceText").innerText = shipping+" جنيه";

document.getElementById("finalTotalPriceText").innerText =
(total+shipping)+" جنيه";

return {
total,
shipping,
final:total+shipping,
qtyTotal
};

}

document.getElementById("custGov").addEventListener("change",calcBill);

function sendToWhatsApp() {

let form = document.getElementById("orderForm");

if(!form.reportValidity()) return;

let bill = calcBill();

if(bill.qtyTotal===0) {
alert("من فضلك اختاري منتج واحد على الأقل");
return;
}

let name = document.getElementById("custName").value.trim();

let phone = document.getElementById("custPhone").value.trim();

let gov = document.getElementById("custGov").value;

let address = document.getElementById("custAddress").value.trim();

let message = `👑 *طلب جديد - ليجن ستور الفيروز* 👑

👤 *بيانات العميل*

الاسم: ${name}
رقم الهاتف: ${phone}
المحافظة: ${gov}
العنوان: ${address}

🛍️ *تفاصيل الطلب*
`;

for(const key in products) {

let qty = parseInt(document.getElementById("qty_"+key).value)||0;

if(qty>0) {

message += `

📦 ${products[key].name}
الكمية: ${qty} قطعة
الألوان:
`;

selectionsMap[key].forEach((color,i)=>{
message += `${i+1}- ${color}\n`;
});

message += `السعر: ${getPrice(key,qty)} جنيه
`;

}

}

message += `

عدد القطع الإجمالي: ${bill.qtyTotal}

سعر المنتجات: ${bill.total} جنيه
مصاريف الشحن: ${bill.shipping} جنيه

💰 *الإجمالي النهائي: ${bill.final} جنيه*

شكراً لثقتكم في ليجن ستور الفيروز ❤️
`;

let url = "https://wa.me/"+WHATSAPP_NUMBER+
"?text="+encodeURIComponent(message);

window.open(url,"_blank");

}

createProducts();

</script>

</body>
</html>
