<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض مصنع الفيروز - ليجن شتوي مبطن</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f9fc;
            color: #333;
            line-height: 1.6;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 20px;
        }
        .top-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        .copy-link-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }
        .copy-link-btn:hover {
            background-color: #0056b3;
        }
        header {
            text-align: center;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 25px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        header p {
            font-size: 16px;
            opacity: 0.95;
        }
        .section-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 10px;
            border-right: 4px solid #ff416c;
            padding-right: 8px;
        }
        .prices-box {
            background: #fff8f8;
            border: 1px dashed #ff416c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .prices-box ul {
            list-style: none;
            padding-right: 10px;
        }
        .prices-box li {
            margin-bottom: 6px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff416c;
            background: #fff;
            outline: none;
        }
        .order-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.3s;
            margin-top: 10px;
        }
        .order-btn:hover {
            background-color: #1ebe5d;
        }
        .note {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- زر نسخ اللينك -->
    <div class="top-bar">
        <button class="copy-link-btn" onclick="copyPageLink()">📋 نسخ رابط الصفحة</button>
    </div>

    <header>
        <h1>🔥 عرض مصنع الفيروز الحصري 🔥</h1>
        <p>ليجن شتوي مبطن دافي ومريح بجودة ممتازة</p>
    </header>

    <div class="prices-box">
        <div class="section-title">💰 أسعار العرض الموفرة:</div>
        <ul>
            <li>✨ قطعة بـ 199 جنيه</li>
            <li>✨ قطعتين بـ 320 جنيه</li>
            <li>✨ 3 قطع بـ 420 جنيه</li>
            <li>✨ 4 قطع بـ 560 جنيه</li>
            <li>🔥 <strong>5 قطع أو أكتر: القطعة بـ 130 جنيه فقط!</strong></li>
        </ul>
    </div>

    <form id="orderForm" onsubmit="sendToWhatsApp(event)">
        <div class="form-group">
            <label for="name">الاسم بالكامل:</label>
            <input type="text" id="name" required placeholder="اكتب اسمك هنا...">
        </div>

        <div class="form-group">
            <label for="phone">رقم الموبايل (رقم أساسي):</label>
            <input type="tel" id="phone" required placeholder="مثال: 010xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="address">العنوان بالتفصيل (المحافظة - المركز/المدينة - الشارع):</label>
            <textarea id="address" rows="3" required placeholder="اكتب عنوانك بالتفصيل لضمان سرعة الشحن..."></textarea>
        </div>

        <div class="form-group">
            <label for="model">اختيار الموديل:</label>
            <select id="model" onchange="updateColors()" required>
                <option value="">-- اختار الموديل --</option>
                <option value="سادة">سادة</option>
                <option value="مضلع">مضلع</option>
                <option value="حفر ليزر ورق شجر">حفر ليزر ورق شجر</option>
            </select>
        </div>

        <div class="form-group">
            <label for="color">اختيار اللون المتاح للموديل:</label>
            <select id="color" required>
                <option value="">-- اختار الموديل أولاً --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="size">اختيار المقاس:</label>
            <select id="size" required>
                <option value="">-- اختار المقاس المناسب --</option>
                <option value="متوسط (من 50 لـ 70 كجم)">متوسط (من 50 لـ 70 كجم)</option>
                <option value="كبير (من 70 لـ 90 كجم)">كبير (من 70 لـ 90 كجم)</option>
                <option value="دبل كينج (من 90 لـ 110 كجم)">دبل كينج (من 90 لـ 110 كجم)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">الكمية المطلوبة (عدد القطع):</label>
            <select id="quantity" required>
                <option value="1 قطعة (199 ج)">1 قطعة (199 ج)</option>
                <option value="قطعتين (320 ج)">قطعتين (320 ج)</option>
                <option value="3 قطع (420 ج)">3 قطع (420 ج)</option>
                <option value="4 قطع (560 ج)">4 قطع (560 ج)</option>
                <option value="5 قطع أو أكثر (القطعة بـ 130 ج)">5 قطع أو أكثر (القطعة بـ 130 ج)</option>
            </select>
        </div>

        <button type="submit" class="order-btn">🛒 اطلب الآن عبر الواتساب</button>
    </form>

    <div class="note">
        ✅ شحن لجميع المحافظات | معاينة قبل الاستلام
    </div>
</div>

<script>
    // تحديث الألوان تلقائياً حسب الموديل المختار لمنع أي أخطاء
    function updateColors() {
        const modelSelect = document.getElementById("model");
        const colorSelect = document.getElementById("color");
        const selectedModel = modelSelect.value;

        // تفريغ القائمة القديمة
        colorSelect.innerHTML = '<option value="">-- اختار اللون --</option>';

        let colors = [];
        if (selectedModel === "سادة") {
            colors = ["أسود"];
        } else if (selectedModel === "مضلع") {
            colors = ["أسود", "رصاصي", "كحلي", "بني", "بيج"];
        } else if (selectedModel === "حفر ليزر ورق شجر") {
            colors = ["أسود", "كحلي"];
        }

        colors.forEach(color => {
            const option = document.createElement("option");
            option.value = color;
            option.textContent = color;
            colorSelect.appendChild(option);
        });
    }

    // زر نسخ اللينك
    function copyPageLink() {
        const dummy = document.createElement('input');
        text_to_copy = window.location.href;
        document.body.appendChild(dummy);
        dummy.value = text_to_copy;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        alert("📋 تم نسخ رابط الصفحة بنجاح! تقدر تبعته في أي وقت للعملاء.");
    }

    // إرسال البيانات للواتساب
    function sendToWhatsApp(event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        const model = document.getElementById("model").value;
        const color = document.getElementById("color").value;
        const size = document.getElementById("size").value;
        const quantity = document.getElementById("quantity").value;

        const whatsappNumber = "201080239769"; // رقم الواتساب الخاص بك

        const message = `🔥 *أوردر جديد من عرض مصنع الفيروز* 🔥\n\n` +
                        `👤 *الاسم:* ${name}\n` +
                        `📞 *رقم الموبايل:* ${phone}\n` +
                        `📍 *العنوان:* ${address}\n\n` +
                        `👗 *التفاصيل المطلوبة:*\n` +
                        `- الموديل: ${model}\n` +
                        `- اللون: ${color}\n` +
                        `- المقاس: ${size}\n` +
                        `- الكمية: ${quantity}\n\n` +
                        `✅ برجاء تأكيد الأوردر ومصاريف الشحن.`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
