<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيروز إكسبريس - تسجيل الأوردرات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #219653;
        }
        #loading {
            display: none;
            text-align: center;
            color: #e67e22;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تسجيل أوردر جديد - الفيروز إكسبريس</h2>
    <form id="orderForm">
        <div class="form-group">
            <label>اسم العميل:</label>
            <input type="text" id="custName" required>
        </div>
        
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="custPhone" required>
        </div>

        <div class="form-group">
            <label>رقم هاتف بديل:</label>
            <input type="tel" id="custPhone2">
        </div>
        
        <div class="form-group">
            <label>المحافظة:</label>
            <input type="text" id="custGov" required>
        </div>
        
        <div class="form-group">
            <label>العنوان بالتفصيل:</label>
            <textarea id="custAddress" rows="3" required></textarea>
        </div>
        
        <div class="form-group">
            <label>عدد القطع:</label>
            <input type="number" id="itemCount" required>
        </div>
        
        <div class="form-group">
            <label>قيمة الأوردر (المنتجات):</label>
            <input type="number" id="orderValue" required>
        </div>
        
        <div class="form-group">
            <label>مصاريف الشحن:</label>
            <input type="number" id="shippingFee" value="65" required>
        </div>

        <div class="form-group">
            <label>محتويات الأوردر:</label>
            <textarea id="orderContent" rows="2" required></textarea>
        </div>

        <div class="form-group">
            <label>شركة الشحن المقترحة:</label>
            <select id="suggestedShipping">
                <option value="روكت للشحن">روكت للشحن</option>
                <option value="محمد الريان">محمد الريان</option>
                <option value="حسام العجمي">حسام العجمي</option>
            </select>
        </div>
        
        <button type="submit" id="submitBtn">حفظ وإرسال الأوردر</button>
        <div id="loading">جاري الإرسال وحفظ الأوردر... ثواني معدودة</div>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyolbhphpB6CitGZ42fZYX7ztQqjgtXcYqEK_-lUb4yug3EGJYOtnRH7Wh4Frzc3DMpJw/exec";

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        const payload = {
            type: "NEW_ORDER",
            custName: document.getElementById('custName').value,
            custPhone: document.getElementById('custPhone').value,
            custPhone2: document.getElementById('custPhone2').value,
            custGov: document.getElementById('custGov').value,
            custAddress: document.getElementById('custAddress').value,
            itemCount: document.getElementById('itemCount').value,
            orderValue: document.getElementById('orderValue').value,
            shippingFee: document.getElementById('shippingFee').value,
            orderContent: document.getElementById('orderContent').value,
            suggestedShipping: document.getElementById('suggestedShipping').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('تم إرسال الأوردر بنجاح!');
            document.getElementById('orderForm').reset();
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        })
        .catch(error => {
            console.error('Error!', error);
            alert('حصل خطأ أثناء الإرسال.');
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        });
    });
</script>

</body>
</html>
